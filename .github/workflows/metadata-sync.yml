name: App Store Connect metadata sync

on:
  push:
    branches: [main]
    paths:
      - "fastlane/metadata_config/**"
  workflow_dispatch: {}

jobs:
  metadata_push:
    # No Xcode/simulator step here -- this lane only talks to the App Store
    # Connect REST API over JWT, so a Linux runner is sufficient and cheaper
    # than macos-latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # Was pinned to 2.6.10 to match the local vendor/bundle tree. That
          # pin was the root cause of two unfixable Dependabot alerts: excon
          # >= 1.5.0 (GHSA-48rx-c7pg-q66r) needs Ruby >= 3.1, and aws-sdk-s3
          # >= 1.208.0 (GHSA-2xgq-q749-89fq) needs Ruby >= 2.7, so neither
          # patched version could ever resolve on 2.6. vendor/bundle is
          # gitignored, so nothing in the repo actually depends on 2.6.0.
          ruby-version: "3.4"
          working-directory: fastlane
          bundler-cache: true
      - name: Write ASC API key to a temp file
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "${{ runner.temp }}/AuthKey.p8"
      - name: Verify decoded key is non-empty
        run: |
          if [ ! -s "${{ runner.temp }}/AuthKey.p8" ]; then
            echo "Decoded ASC API key is empty -- check the ASC_KEY_P8_BASE64 secret." >&2
            exit 1
          fi
      - name: Push metadata diff
        working-directory: fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        # NOTE: forced to dry_run:true for now. The seeded metadata_config
        # had never had a verified clean dry run against real credentials
        # (see the version_info.yml fix for why the first real run would
        # have shown a false 5-field diff) -- so this workflow has never
        # actually proven a real push is safe. A human must confirm a clean
        # `bundle exec fastlane metadata_push dry_run:true` run against real
        # ASC credentials, then flip this to a real push (drop
        # `dry_run:true` below) deliberately, with review.
        run: bundle exec fastlane metadata_push dry_run:true
