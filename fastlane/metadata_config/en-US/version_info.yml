description: |-
  NozzleCast is a live monitoring companion for your self-hosted 3D printer management server, built for Bambu Lab printers. Connect it to your own server instance and monitor every printer on your farm — no cloud account, no subscription, no data leaving your own network.

  LIVE ACTIVITIES THAT ACTUALLY UPDATE
  Start a print and NozzleCast puts a Live Activity on your Lock Screen and in the Dynamic Island — even if the app isn't open and your phone is locked. It shows real progress (not a rough estimate), a localized finish time, live temperatures, and the cover image or camera snapshot for the job, and keeps updating for the entire print.

  KNOW WHEN SOMETHING NEEDS ATTENTION
  A color-coded badge — yellow for a warning, red for an error — appears the moment your server reports an HMS issue serious enough to matter, matching the same severity your server's own dashboard shows. No more guessing whether "Paused" means a filament runout or nothing at all.

  YOUR WHOLE FARM AT A GLANCE
  The Monitor tab shows every printer's state, job, progress, and AMS filament colors at once. Tap in for full detail: temperatures, print controls, and per-slot filament info.

  FILAMENT INVENTORY, NOT GUESSWORK
  Track every spool — material, color, brand, remaining weight, and whether it's loaded in an AMS or sitting in storage. Scan a spool's barcode or printed label with your camera to add it in seconds, entirely on-device.

  BUILT FOR SELF-HOSTERS
  NozzleCast talks directly to your self-hosted server's API. Live Activity push updates go through a small relay you run yourself (nozzlecast-relay, open source). There is no NozzleCast account and no NozzleCast server in between — your printer data stays on your own infrastructure.

  Requires an existing compatible self-hosted printer management server on your network. Live Activities and Lock Screen push updates require the optional nozzlecast-relay component.
