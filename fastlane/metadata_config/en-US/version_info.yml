  • Adds the Bambu Lab H3C.

  REDESIGNED LIVE ACTIVITY
  • A new Lock Screen and Dynamic Island design with a sharp cover of the model, on a background that keeps it visible whatever the filament color.
  • With nozzlecast-relay, covers also show for HTTPS-dispatched prints.

  SCAN SPOOLS WITH A SPOOL READER
  • Put a spool on a spool reader connected to your server and NozzleCast opens it, ready to edit or assign to an AMS slot.
  • A tag that isn't linked yet can be linked to one of your spools, or added as a new spool with its material, color, and brand filled in from the tag.

  NOTIFICATIONS
  • Notification photos are bigger and open full screen, with pinch to zoom.
  • Swipe left on an alert you don't need to mute it. With nozzlecast-relay, muted alerts stay off your Lock Screen too.
  • Settings shows where your alerts come from. nozzlecast-relay can deliver them without Firebase.

  PRINTS
  • Print history shows a picture for every print, including HTTPS-dispatched ones with nozzlecast-relay.
  • When your server holds a queued job because its filament isn't loaded or won't last, NozzleCast says why and lets you print anyway.
