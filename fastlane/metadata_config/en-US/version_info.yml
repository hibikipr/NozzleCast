whats_new: |-
  PRINT QUEUE AND HISTORY
  • New Prints tab shows your server's print queue and print history. See what's waiting and why, start staged jobs, and reorder or remove queued jobs.
  • Browse past prints with plate thumbnails, duration, filament, cost, and failure reasons, and filter by Needs Verdict, Good, Rejected, or Failed.
  • Mark how a print came out with Good or Reject, right from the app.

  SMARTER FILAMENT INVENTORY
  • Low-stock warnings on spools, with a Low Stock filter and a running count.
  • Shopping list for filament you need to buy, with running-low spools suggested for you.
  • Each spool now shows grams left, last used, and per-print usage history.
  • Works whether your server tracks filament itself or through Spoolman.

  REDESIGNED PRINTER SCREEN
  • Controls and sections now adapt to what the printer is doing, with a new last-print card, compact temperature chips, and AMS slots in full-width columns.
  • Monitor cards are taller and keep a steady size as prints start and finish.
  • Printer state and alerts are now shown separately, so an idle printer with an alert no longer reads "Error".

  ALERTS WITHOUT FIREBASE
  • Server alerts now reach you as notifications even if your server has no Firebase set up, including while the app is in the background.
  • Alert colors follow your server's HMS alert levels.

  Plus improved localization and assorted fixes.
