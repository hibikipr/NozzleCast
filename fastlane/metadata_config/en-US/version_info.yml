whats_new: |-
  HOME SCREEN WIDGETS
  • New Print Status widget shows your print like the Lock Screen Live Activity: the model's cover, the printer, the job name and a countdown that ticks on its own.
  • Small shows one printer, medium adds finish time and temperatures, and large shows two printers.
  • Choose a printer in Edit Widget, or leave it on automatic to show the print that finishes soonest.
  • A paused print says Paused, and an idle printer keeps showing its last print and whether it finished, failed or was cancelled.
  • The AMS Colors widget is redrawn as a spool rack, with each slot in its filament's color and effect, and the slot feeding the current print glows.
  • New Filament Stock widget for your AMS slots.
  • Background refresh now updates your printers as well as alerts, so widgets stay current while NozzleCast is closed.

  NEW LANGUAGES
  • NozzleCast is now available in Chinese (Simplified and Traditional), Dutch, French, German, Italian, Japanese, Korean, Polish, Portuguese (Brazil), Russian, Spanish, Swedish, Turkish and Ukrainian.

  LABEL PHOTO AND SPOOLS
  • Label Photo reads filament boxes much better: it looks up barcodes, then the SKU, then the label's own words, and fills in color, subtype, effect and extra colors.
  • Spools take their finish from the Effect field, as your server does, and Edit Spool has a new Effect picker with a live preview.
  • Any material can be saved, spelled as your server spells it, so an ASA roll is no longer saved as ABS.
  • A barcode shared by several spool sizes now picks the right weight.
  • Spools added or linked from a scanned tag are saved the same way your server saves them itself.

  DYNAMIC ISLAND
  • The time remaining is no longer cut off when another app's Live Activity or a phone call shares the island. It now reads 3h 25m, 25m, or 1m.

  RELIABILITY
  • Printer state is kept through brief connection blips, and alerts are no longer lost quietly.
