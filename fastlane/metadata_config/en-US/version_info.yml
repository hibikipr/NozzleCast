description: |-
  NozzleCast is a live monitoring companion for your self-hosted 3D printer management server, built for Bambu Lab printers. Connect it to your own server instance and monitor every printer on your farm — no cloud account, no subscription, no data leaving your own network.

  LIVE ACTIVITIES THAT ACTUALLY UPDATE
  Start a print and NozzleCast puts a Live Activity on your Lock Screen and in the Dynamic Island — even if the app isn't open and your phone is locked. It shows real progress (not a rough estimate), a localized finish time, live temperatures, and a sharp cover image of the model, and keeps updating for the entire print.

  KNOW WHEN SOMETHING NEEDS ATTENTION
  A color-coded badge — yellow for a warning, red for an error — appears the moment your server reports an HMS issue serious enough to matter, matching the same severity your server's own dashboard shows. No more guessing whether "Paused" means a filament runout or nothing at all. Alerts arrive with a camera photo you can open full screen, and an alert you don't need can be muted with a swipe.

  YOUR WHOLE FARM AT A GLANCE
  The Monitor tab shows every printer's state, job, progress, and AMS filament colors at once, with an animated picture of each printer showing what it's doing. Choose from four card layouts, with the live camera while printing, the job's cover while paused, and the last print when idle. Tap in for full detail: temperatures, print controls, and per-slot filament info.

  MADE FOR IPHONE DUO
  NozzleCast supports iPhone Duo. With the Duo open, your printer list and the selected printer sit side by side. Partly open, the printer's live camera view stays pinned on top while the controls scroll below it. Closed, you get the familiar single-column layout.

  FILAMENT INVENTORY, NOT GUESSWORK
  Track every spool — material, color, brand, remaining weight, and whether it's loaded in an AMS or sitting in storage. Scan a spool's barcode or printed label with your camera to add it in seconds, entirely on-device, or put it on a spool reader connected to your server.

  PRINT QUEUE AND HISTORY
  See what's queued and why, start staged jobs, and find out before a job starts on filament that won't last. Browse past prints with pictures, and mark how each one came out.

  BUILT FOR SELF-HOSTERS
  NozzleCast talks directly to your self-hosted server's API. Live Activity push updates go through a small relay you run yourself (nozzlecast-relay, open source). There is no NozzleCast account and no NozzleCast server in between — your printer data stays on your own infrastructure.

  Requires an existing compatible self-hosted printer management server on your network. Live Activities and Lock Screen push updates require the optional nozzlecast-relay component.
